openapi: 3.0.3
info:
  title: Chat Backend API
  version: 1.0.0
  description: High-performance, production-quality Chat Backend technical assessment API.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Alice Smith
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  minLength: 8
                  example: Password123!
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      email:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                  token:
                    type: string
        '400':
          description: Invalid input or weak password
        '409':
          description: Email already registered

  /auth/login:
    post:
      summary: Authenticate user and obtain JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Get current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
        '401':
          description: Unauthorized

  /chat/create:
    post:
      summary: Create or retrieve a direct 1:1 chat between two users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userAId
                - userBId
              properties:
                userAId:
                  type: string
                  format: uuid
                  example: 11111111-1111-4111-8111-111111111111
                userBId:
                  type: string
                  format: uuid
                  example: 22222222-2222-4222-8222-222222222222
      responses:
        '201':
          description: Direct chat created
          content:
            application/json:
              schema:
                type: object
                properties:
                  chatId:
                    type: string
                    format: uuid
                    example: 33333333-3333-4333-8333-333333333333
        '200':
          description: Existing direct chat returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  chatId:
                    type: string
                    format: uuid
                    example: 33333333-3333-4333-8333-333333333333
        '400':
          description: Validation error or self-chat attempt
        '401':
          description: Missing or invalid token
        '403':
          description: Caller unauthorized to create chat for other users
        '404':
          description: One or both users not found

  /chat/{chatId}/message/send:
    post:
      summary: Send a message to an authorized chat room
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - senderId
                - text
              properties:
                senderId:
                  type: string
                  format: uuid
                  example: 11111111-1111-4111-8111-111111111111
                text:
                  type: string
                  maxLength: 4000
                  example: Hello, assessment!
      responses:
        '201':
          description: Message persisted in Firestore
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                  chatId:
                    type: string
                    format: uuid
                  senderId:
                    type: string
                    format: uuid
                  text:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Validation error or oversized message
        '401':
          description: Missing or invalid token
        '403':
          description: Caller not a member or mismatched senderId
        '404':
          description: Chat not found

  /chat/{chatId}/messages:
    get:
      summary: Retrieve chronologically ordered chat messages with cursor pagination
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Chronological message list
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        chatId:
                          type: string
                          format: uuid
                        senderId:
                          type: string
                          format: uuid
                        text:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      nextCursor:
                        type: string
                        nullable: true
                      hasMore:
                        type: boolean
        '400':
          description: Invalid path or query parameters
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not a member of the chat
        '404':
          description: Chat not found

  /chat/{chatId}/message/{messageId}/read:
    post:
      summary: Mark a message as read (idempotent)
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Message marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId:
                    type: string
                  userId:
                    type: string
                    format: uuid
                  readAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    example: read
        '400':
          description: Invalid path or body parameters
        '401':
          description: Missing or invalid token
        '403':
          description: Non-member or mismatched body userId
        '404':
          description: Chat or message not found

  /chat/{chatId}/lastseen:
    post:
      summary: Update user last-seen message pointer with monotonicity guarantee
      security:
        - BearerAuth: []
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - messageId
              properties:
                userId:
                  type: string
                  format: uuid
                messageId:
                  type: string
      responses:
        '200':
          description: Last-seen pointer updated or verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  chatId:
                    type: string
                    format: uuid
                  userId:
                    type: string
                    format: uuid
                  lastSeenMessageId:
                    type: string
                  lastSeenAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                    enum: [updated, already_current, ignored_older_than_current]
        '400':
          description: Invalid path or body parameters
        '401':
          description: Missing or invalid token
        '403':
          description: Non-member or mismatched body userId
        '404':
          description: Chat or message not found

  /user/{userId}/chats:
    get:
      summary: Retrieve all conversations and member IDs for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User chats list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      chats:
                        type: array
                        items:
                          type: object
                          properties:
                            chatId:
                              type: string
                              format: uuid
                            type:
                              type: string
                              example: DIRECT
                            memberIds:
                              type: array
                              items:
                                type: string
                                format: uuid
                            createdAt:
                              type: string
                              format: date-time
                      nextCursor:
                        type: string
                        nullable: true
        '400':
          description: Invalid user ID or query parameters
        '401':
          description: Missing or invalid token
        '403':
          description: Unauthorized attempt to list chats for another user
        '404':
          description: User not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
